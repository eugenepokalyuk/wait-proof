name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'deploy/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

# Две выкатки на один сервер перетрут друг друга
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/eugenepokalyuk/wait-proof-api

jobs:
  # Образ собирается здесь, а не на сервере: там 1,9 ГБ памяти и уже работает
  # Форма, сборка на месте однажды уже роняла её по памяти
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Тесты
        working-directory: api
        env:
          DB_ENGINE: sqlite
        run: |
          pip install -q -r requirements.txt
          python manage.py test tests

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Пока сервер не подготовлен (секреты не заведены), выкатка пропускается,
    # а не краснеет на каждом пуше
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Выкатить на сервер
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          # С \n на конце: OpenSSH не читает ключ без завершающего перевода строки
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Пиним ключ хоста: без него ssh либо спросит подтверждение, либо
          # молча пустит на подменённый сервер
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy waitproof@"$HOST" "IMAGE_TAG=${{ github.sha }} bash -s" < deploy/deploy.sh

      - name: Проверка снаружи
        # Через nginx Формы — так проверяется вся цепочка, а не только контейнер
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://168-222-142-117.sslip.io/api/v1/health || echo 000)
            if [ "$code" = "200" ]; then echo "ОК: API отвечает 200"; exit 0; fi
            sleep 3
          done
          echo "API снаружи не отвечает (последний код: $code)"; exit 1
