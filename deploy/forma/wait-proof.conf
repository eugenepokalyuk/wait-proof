# Блоки для «Я тебя жду» в nginx Формы.
# Вставляются в конец nginx/nginx.conf репозитория forma-project.
#
# Главное правило: nginx Формы должен стартовать при любом состоянии нашего
# проекта. Поэтому:
# - сертификат лежит по пути, где файл есть всегда (bootstrap кладёт временный
#   самоподписанный, certbot подменяет настоящим);
# - прокси в наш контейнер через переменную и resolver: с обычным
#   proxy_pass http://wait-proof-api:8000 nginx не запустился бы, если
#   контейнера нет, — и вместе с ним легла бы Форма.

server {
    listen 80;
    server_name 168-222-142-117.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 168-222-142-117.sslip.io;
    client_max_body_size 1M;

    ssl_certificate /etc/nginx/wait-proof-certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/wait-proof-certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 127.0.0.11 — встроенный DNS Docker. valid=10s: после пересоздания
    # контейнера новый адрес подхватится сам, без reload nginx
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $wait_proof_api http://wait-proof-api:8000;

    location / {
        proxy_pass $wait_proof_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
